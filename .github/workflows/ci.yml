name: CI

on:
  push:
    branches: [main, databricks-migration]
  pull_request:

jobs:
  tests:
    name: App and pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt databricks-sql-connector ruff
      - name: Lint (new lakehouse and Databricks code)
        run: ruff check --select E,F,W,I --line-length 130 --exclude lakehouse/notebooks lakehouse src/sql_dialect.py src/warehouse.py tests/test_lakehouse_sources.py tests/test_lakehouse_spark.py tests/test_warehouse.py tests/lakehouse_reference.py
      - name: Tests
        run: pytest -q

  spark:
    name: Spark SQL parity and gold reconciliation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt "pyspark==4.0.1" pyarrow
      - name: Gold matches the demo; agent queries match on Spark SQL
        env:
          SPARK_LOCAL_IP: 127.0.0.1
        run: pytest -q tests/test_lakehouse_spark.py
